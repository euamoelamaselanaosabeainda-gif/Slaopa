name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Abrir o zip
        run: unzip -o "CinemaCast (3).zip" -d src
      - name: Compilar
        run: cd src/CinemaCast && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CinemaCast-apk
          path: src/CinemaCast/app/build/outputs/apk/debug/*.apk
